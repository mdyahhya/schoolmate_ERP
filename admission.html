<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admissions &amp; Enquiry — School ERP</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="app-container">
  <aside class="sidebar" id="sidebar-container"></aside>
  <main class="main-layout">
    <header class="header" id="header-container"></header>
    <div class="content-viewport">

      <div class="content-card">
        <div class="card-header">
          <h3 class="card-title">Admissions &amp; Enquiries Ledger</h3>
          <button class="btn btn-primary" id="btn-new-enquiry">
            <span data-icon="plus"></span> Register New Enquiry
          </button>
        </div>
        <div class="card-body">
          <div class="search-filter-bar">
            <div class="search-input-wrapper">
              <span data-icon="search"></span>
              <input type="text" id="enquiry-search" class="form-control" placeholder="Search by Candidate or Parent Name…">
            </div>
            <div class="filter-group">
              <label class="form-label" style="margin-bottom:0;">Status:</label>
              <select id="enquiry-filter-status" class="form-control" style="width:150px;">
                <option value="">All Statuses</option>
                <option value="Pending">Pending</option>
                <option value="Follow-up">Follow-up</option>
                <option value="Registered">Registered</option>
                <option value="Admitted">Admitted</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table" id="enquiry-table">
              <thead>
                <tr>
                  <th>Candidate Name</th>
                  <th>Parent/Guardian</th>
                  <th>Contact No.</th>
                  <th>Class Requested</th>
                  <th>Status</th>
                  <th>Registered On</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody><tr><td colspan="7" style="text-align:center;color:var(--text-secondary);">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="app-modal">
  <div class="modal-content" id="app-modal-content">
    <div class="modal-header">
      <h3 class="modal-title" id="app-modal-title">Enquiry</h3>
      <button class="modal-close" id="app-modal-close-btn"></button>
    </div>
    <div class="modal-body" id="app-modal-body"></div>
    <div class="modal-footer" id="app-modal-footer">
      <button class="btn btn-secondary" id="app-modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="app-modal-submit">Save</button>
    </div>
  </div>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/shell.js"></script>
<script>
let allEnquiries = [];

document.addEventListener('DOMContentLoaded', () => {
  loadAdmissions();
  document.getElementById('btn-new-enquiry').addEventListener('click', openNewEnquiryModal);
  document.getElementById('enquiry-search').addEventListener('input', filterEnquiries);
  document.getElementById('enquiry-filter-status').addEventListener('change', filterEnquiries);
});

async function loadAdmissions() {
  const res = await window.electronAPI.dbAll('SELECT * FROM admissions ORDER BY created_at DESC');
  allEnquiries = (res.success && res.data) ? res.data : [];
  renderTable(allEnquiries);
}

function renderTable(data) {
  const tbody = document.querySelector('#enquiry-table tbody');
  if (!data.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-secondary);">No enquiry records found.</td></tr>';
    return;
  }
  tbody.innerHTML = data.map(r => `
    <tr>
      <td>${r.candidate_name}</td>
      <td>${r.parent_name || '—'}</td>
      <td>${r.contact_phone || '—'}</td>
      <td>${r.class_requested || '—'}</td>
      <td><span class="badge badge-${r.status==='Admitted'?'success':r.status==='Pending'?'warning':'info'}">${r.status}</span></td>
      <td>${r.created_at ? r.created_at.substring(0,10) : '—'}</td>
      <td>
        <button class="icon-btn" title="Edit" onclick="editEnquiry(${r.id})"><span data-icon="edit"></span></button>
        <button class="icon-btn" title="Delete" onclick="deleteEnquiry(${r.id})"><span data-icon="delete"></span></button>
      </td>
    </tr>`).join('');
  document.querySelectorAll('[data-icon]').forEach(el => {
    const n = el.getAttribute('data-icon');
    if (icons[n]) el.innerHTML = icons[n];
  });
}

function filterEnquiries() {
  const q = document.getElementById('enquiry-search').value.toLowerCase();
  const s = document.getElementById('enquiry-filter-status').value;
  let data = allEnquiries;
  if (q) data = data.filter(r => r.candidate_name.toLowerCase().includes(q) || (r.parent_name||'').toLowerCase().includes(q));
  if (s) data = data.filter(r => r.status === s);
  renderTable(data);
}

function openNewEnquiryModal(existing = null) {
  const modal = document.getElementById('app-modal');
  document.getElementById('app-modal-title').textContent = existing ? 'Edit Enquiry' : 'Register New Enquiry';
  document.getElementById('app-modal-body').innerHTML = `
    <div class="form-grid">
      <div class="form-group"><label class="form-label">Candidate Name *</label>
        <input id="mf-candidate" class="form-control" value="${existing?.candidate_name||''}" required></div>
      <div class="form-group"><label class="form-label">Parent / Guardian</label>
        <input id="mf-parent" class="form-control" value="${existing?.parent_name||''}"></div>
      <div class="form-group"><label class="form-label">Contact Phone</label>
        <input id="mf-phone" class="form-control" value="${existing?.contact_phone||''}"></div>
      <div class="form-group"><label class="form-label">Class Requested</label>
        <input id="mf-class" class="form-control" value="${existing?.class_requested||''}"></div>
      <div class="form-group"><label class="form-label">Status</label>
        <select id="mf-status" class="form-control">
          ${['Pending','Follow-up','Registered','Admitted','Rejected'].map(s=>`<option ${existing?.status===s?'selected':''}>${s}</option>`).join('')}
        </select></div>
    </div>`;
  document.getElementById('app-modal-footer').innerHTML = `
    <button class="btn btn-secondary" id="app-modal-cancel">Cancel</button>
    <button class="btn btn-primary" id="_enq-save">Save Enquiry</button>`;
  modal.classList.add('active');
  document.getElementById('app-modal-cancel').onclick = () => modal.classList.remove('active');
  document.getElementById('app-modal-close-btn').onclick = () => modal.classList.remove('active');
  document.getElementById('_enq-save').onclick = async () => {
    const candidate = document.getElementById('mf-candidate').value.trim();
    if (!candidate) { showToast('Candidate name is required.','danger'); return; }
    const params = [candidate, document.getElementById('mf-parent').value.trim(),
      document.getElementById('mf-phone').value.trim(), document.getElementById('mf-class').value.trim(),
      document.getElementById('mf-status').value];
    if (existing) {
      await window.electronAPI.dbRun('UPDATE admissions SET candidate_name=?,parent_name=?,contact_phone=?,class_requested=?,status=? WHERE id='+existing.id, params);
      showToast('Enquiry updated.','success');
    } else {
      await window.electronAPI.dbRun('INSERT INTO admissions(candidate_name,parent_name,contact_phone,class_requested,status) VALUES(?,?,?,?,?)', params);
      showToast('Enquiry registered.','success');
    }
    modal.classList.remove('active');
    loadAdmissions();
  };
}

async function editEnquiry(id) {
  const res = await window.electronAPI.dbGet('SELECT * FROM admissions WHERE id=?',[id]);
  if (res.success && res.data) openNewEnquiryModal(res.data);
}

function deleteEnquiry(id) {
  showConfirmDialog('Delete this enquiry record permanently?', async () => {
    await window.electronAPI.dbRun('DELETE FROM admissions WHERE id=?',[id]);
    showToast('Enquiry deleted.','info');
    loadAdmissions();
  });
}
</script>
</body>
</html>
