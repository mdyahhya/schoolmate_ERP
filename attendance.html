<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Logs — School ERP</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="app-container">
  <aside class="sidebar" id="sidebar-container"></aside>
  <main class="main-layout">
    <header class="header" id="header-container"></header>
    <div class="content-viewport">

      <div class="content-card" style="margin-bottom:24px;">
        <div class="card-header"><h3 class="card-title">Daily Student Attendance Registry</h3></div>
        <div class="card-body">
          <div class="search-filter-bar">
            <div class="filter-group">
              <label class="form-label" style="margin-bottom:0;">Date:</label>
              <input type="date" id="attendance-date" class="form-control" style="width:160px;">
              <label class="form-label" style="margin-bottom:0;">Class:</label>
              <select id="attendance-class" class="form-control" style="width:130px;"></select>
              <label class="form-label" style="margin-bottom:0;">Section:</label>
              <select id="attendance-section" class="form-control" style="width:130px;"></select>
            </div>
            <button class="btn btn-primary" id="btn-load-attendance">Load Class</button>
          </div>

          <div class="table-responsive" style="margin-bottom:20px;">
            <table class="table" id="attendance-entry-table">
              <thead><tr><th>Roll No.</th><th>Student Name</th><th>Status</th><th>Remarks</th></tr></thead>
              <tbody><tr><td colspan="4" style="text-align:center;color:var(--text-secondary);">Select date, class and section filters to load the attendance registry.</td></tr></tbody>
            </table>
          </div>
          <div class="form-actions" id="attendance-actions" style="display:none;">
            <button class="btn btn-primary" id="btn-save-attendance">Save Attendance Log</button>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>
<div class="toast-container" id="toast-container"></div>
<div class="modal-overlay" id="app-modal">
  <div class="modal-content" id="app-modal-content">
    <div class="modal-header"><h3 class="modal-title" id="app-modal-title">Confirm</h3><button class="modal-close" id="app-modal-close-btn"></button></div>
    <div class="modal-body" id="app-modal-body"></div>
    <div class="modal-footer" id="app-modal-footer"><button class="btn btn-secondary" id="app-modal-cancel">Cancel</button><button class="btn btn-primary" id="app-modal-submit">Confirm</button></div>
  </div>
</div>
<script src="assets/js/browser-bridge.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/shell.js"></script>
<script>
let classes = [], sections = [], currentStudents = [];

document.addEventListener('DOMContentLoaded', async () => {
  // Default to today
  document.getElementById('attendance-date').valueAsDate = new Date();
  const [cRes, sRes] = await Promise.all([
    window.electronAPI.dbAll('SELECT * FROM classes ORDER BY class_name ASC'),
    window.electronAPI.dbAll('SELECT * FROM sections ORDER BY section_name ASC')
  ]);
  classes  = cRes.success ? cRes.data : [];
  sections = sRes.success ? sRes.data : [];
  const cSel = document.getElementById('attendance-class');
  const sSel = document.getElementById('attendance-section');
  classes.forEach(c  => cSel.innerHTML += `<option value="${c.id}">${c.class_name}</option>`);
  sections.forEach(s => sSel.innerHTML += `<option value="${s.id}">${s.section_name}</option>`);
  document.getElementById('btn-load-attendance').addEventListener('click', loadAttendance);
  document.getElementById('btn-save-attendance').addEventListener('click', saveAttendance);
});

async function loadAttendance() {
  const date    = document.getElementById('attendance-date').value;
  const classId = document.getElementById('attendance-class').value;
  const sectId  = document.getElementById('attendance-section').value;
  if (!date || !classId) { showToast('Please select a date and class.','danger'); return; }

  let query = 'SELECT * FROM students WHERE class_id=? AND status="Active"';
  const params = [classId];
  if (sectId) { query += ' AND section_id=?'; params.push(sectId); }
  query += ' ORDER BY roll_number ASC';

  const studRes = await window.electronAPI.dbAll(query, params);
  currentStudents = (studRes.success && studRes.data) ? studRes.data : [];

  // Load existing attendance for this date
  const attRes = await window.electronAPI.dbAll(
    'SELECT * FROM student_attendance WHERE date=? AND student_id IN (SELECT id FROM students WHERE class_id=?)', [date, classId]
  );
  const existing = {};
  if (attRes.success && attRes.data) attRes.data.forEach(r => existing[r.student_id] = r);

  const tbody = document.querySelector('#attendance-entry-table tbody');
  if (!currentStudents.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-secondary);">No active students found for this class.</td></tr>';
    document.getElementById('attendance-actions').style.display = 'none';
    return;
  }
  tbody.innerHTML = currentStudents.map(s => {
    const att = existing[s.id];
    const status = att ? att.status : 'Present';
    return `<tr>
      <td>${s.roll_number||'—'}</td>
      <td>${s.full_name}</td>
      <td>
        <select class="form-control att-status" data-sid="${s.id}" style="width:130px;">
          <option ${status==='Present'?'selected':''}>Present</option>
          <option ${status==='Absent'?'selected':''}>Absent</option>
          <option ${status==='Late'?'selected':''}>Late</option>
          <option ${status==='Excused'?'selected':''}>Excused</option>
        </select>
      </td>
      <td><input type="text" class="form-control att-remarks" data-sid="${s.id}" placeholder="Remarks…" value="${att?.remarks||''}" style="width:200px;"></td>
    </tr>`;
  }).join('');
  document.getElementById('attendance-actions').style.display = 'flex';
}

async function saveAttendance() {
  const date    = document.getElementById('attendance-date').value;
  const classId = document.getElementById('attendance-class').value;
  const statuses = document.querySelectorAll('.att-status');
  const remarks  = document.querySelectorAll('.att-remarks');
  let saved = 0;
  for (let i = 0; i < statuses.length; i++) {
    const sid    = statuses[i].getAttribute('data-sid');
    const status = statuses[i].value;
    const remark = remarks[i].value;
    await window.electronAPI.dbRun(
      `INSERT INTO student_attendance(student_id,class_id,date,status,remarks) VALUES(?,?,?,?,?)
       ON CONFLICT(student_id,date) DO UPDATE SET status=excluded.status,remarks=excluded.remarks`,
      [sid, classId, date, status, remark]
    );
    saved++;
  }
  showToast(`Attendance saved for ${saved} students.`,'success');
}
</script>
</body>
</html>
